<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Dark Calendar</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div id="app">

    <header class="topbar">
      <div>
        <h1 id="monthTitle">September 2026</h1>
        <p id="todayLabel">Today</p>
      </div>

      <button class="icon-button" id="settingsButton" aria-label="Settings">
        ⚙
      </button>
    </header>

    <main>
      <section id="calendarScreen" class="screen active">

        <div class="calendar-navigation">
          <button class="nav-button" id="previousMonth">‹</button>
          <button class="today-button" id="todayButton">Today</button>
          <button class="nav-button" id="nextMonth">›</button>
        </div>

        <div class="calendar">
          <div class="weekdays">
            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <section class="upcoming">
          <div class="section-header">
            <h2>Upcoming</h2>
            <button id="addEventButton" class="small-add">+</button>
          </div>

          <div id="upcomingEvents" class="event-list"></div>
        </section>

      </section>

      <section id="countdownScreen" class="screen">

        <div class="screen-heading">
          <div>
            <h2>Countdowns</h2>
            <p>Keep track of the days that matter.</p>
          </div>

          <button id="addCountdownButton" class="add-button">+</button>
        </div>

        <div id="countdownList" class="countdown-list"></div>

      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-tab active" data-screen="calendarScreen">
        <span>▦</span>
        <label>Calendar</label>
      </button>

      <button class="nav-tab" data-screen="countdownScreen">
        <span>◷</span>
        <label>Countdowns</label>
      </button>
    </nav>

  </div>

  <div id="modalContainer"></div>

  <script src="/app.js"></script>
</body>
</html>
